# Linux host networking retains the application's loopback-only listener.
services:
  web:
    image: ${STRIPSEARCH_IMAGE:?Set an immutable StripSearch image tag}
    network_mode: host
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - /etc/stripsearch/runtime.env
    volumes:
      - /var/lib/stripsearch:/var/lib/stripsearch:Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
