<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="icon" href="data:,"><title>StripSearch · 跨平台人物研究</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="atlas.css"><script src="atlas-ui.js" defer></script><script src="demo.js" defer></script></head>
<body data-direction="atlas"><a class="skip" href="#entry-form">跳到研究入口</a>
<div id="landing">
<header class="site-nav"><a class="brand" href="#/" aria-label="StripSearch 首页"><span class="brand-mark">s/s</span>StripSearch</a><nav aria-label="主要导航"><a href="#explore">交互图谱</a><a href="#workflow">研究流程</a><button data-settings>配置</button></nav><button class="nav-cta" data-open>进入工作台 <span>↗</span></button></header>
<main><section class="hero"><div class="hero-heading"><span class="preview-label">交互演示 · 合成样例</span><h1>跨平台研究一个人<span>。</span></h1><p>账号、作品和公开互动，逐条回到来源。</p></div>
<form id="entry-form" class="entry-form"><div class="entry-tabs" aria-label="线索类型"><button type="button" data-mode="name" aria-pressed="true">姓名 / 主页</button><button type="button" data-mode="handle" aria-pressed="false">用户名</button><button type="button" data-mode="email" aria-pressed="false">邮箱</button><button type="button" data-mode="image" aria-pressed="false">图片出处</button></div><label for="seed" id="seed-label">公开姓名、公司或主页</label><div class="input-line"><input id="seed" placeholder="例如：林舟，Lantern 项目" autocomplete="off" maxlength="200"><button class="primary" type="submit">开始研究 <span>↗</span></button></div><p id="mode-help">先选择范围，再开始。当前仅运行林舟合成示例。</p><div id="image-entry" hidden><label class="file-label" for="image-file">本人或已授权图片</label><input type="file" id="image-file" accept="image/png,image/jpeg,image/webp"><p id="image-status">仅本地预览，不上传；核查图片出处，不识别人脸。</p><img id="image-preview" alt="授权图片本地预览" hidden></div></form>
<div class="entry-shortcuts"><button data-open>试用林舟示例 →</button><button data-settings data-tab="connections">配置数据源 ↗</button></div></section>
<section id="explore" class="home-explorer" aria-label="可交互的账号图谱"><div class="explorer-top"><div><span class="mini-avatar">Lz.</span><strong>林舟</strong><span class="subtle">/ Lantern</span></div><div class="explorer-controls"><span>实线 · 有归属依据</span><button data-home-reset>重置选择</button></div></div><div id="home-graph"></div></section>
<section class="workflow-section" id="workflow"><div class="workflow-heading"><h2>研究流程</h2><button class="text-button" data-setup>配置一次研究 ↗</button></div><div class="workflow-tabs" aria-label="研究流程"><button data-flow="discover" aria-pressed="true"><span>1</span>发现候选</button><button data-flow="verify" aria-pressed="false"><span>2</span>核查归属</button><button data-flow="read" aria-pressed="false"><span>3</span>检查原文</button><button data-flow="export" aria-pressed="false"><span>4</span>输出报告</button></div><div id="flow-detail"></div></section>
</main><footer class="site-footer"><a class="brand" href="#/"><span class="brand-mark">s/s</span>StripSearch</a><span>公开资料 · 证据可追溯</span><a href="dossier.html">B 方案存档</a><a href="https://github.com/cubxxw/StripSearch" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer></div>
<main id="workspace" hidden></main><dialog id="evidence-dialog" aria-labelledby="dialog-title"><div id="evidence-body"></div></dialog><div id="notice" class="notice" role="status"></div>
</body></html>
