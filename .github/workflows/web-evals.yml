name: Web and offline evaluations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
      - name: Runtime tests (offline providers)
        run: npm --prefix apps/web test
      - name: Dataset integrity (no answer grading)
        run: python3 scripts/check_eval_datasets.py
      - name: Frozen provider evaluations (no external requests)
        run: npm --prefix apps/web run eval
      - name: Static design checks
        run: python3 scripts/check_design.py
